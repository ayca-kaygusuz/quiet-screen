name: Windows build and Google configuration

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the Windows installer on GitHub Releases
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --package-lock=false
      - run: npm test
      - name: Verify Google client configuration and configure Windows app
        env:
          QUIET_SCREEN_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.QUIET_SCREEN_GOOGLE_DESKTOP_CLIENT_ID }}
          QUIET_SCREEN_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.QUIET_SCREEN_GOOGLE_DESKTOP_CLIENT_SECRET }}
          QUIET_SCREEN_GOOGLE_WEB_CLIENT_ID: ${{ vars.QUIET_SCREEN_GOOGLE_WEB_CLIENT_ID }}
          QUIET_SCREEN_GOOGLE_WEB_CLIENT_SECRET: ${{ secrets.QUIET_SCREEN_GOOGLE_WEB_CLIENT_SECRET }}
        run: |
          node scripts/check-google-release.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/configure-desktop.mjs
      - name: Install Windows build tools
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = 'electron-v45.2.3-win32-x64.zip'
          $release = 'https://github.com/electron/electron/releases/download/v45.2.3'
          $runtime = Join-Path $env:RUNNER_TEMP 'quiet-screen-electron'
          $zip = Join-Path $env:RUNNER_TEMP $archive
          $sums = Join-Path $env:RUNNER_TEMP 'electron-sha256.txt'
          Invoke-WebRequest "$release/$archive" -OutFile $zip
          Invoke-WebRequest "$release/SHASUMS256.txt" -OutFile $sums
          $line = Get-Content $sums | Where-Object { $_ -match ('\s+\*?' + [regex]::Escape($archive) + '$') }
          $expected = ($line -split '\s+')[0]
          if (!$expected -or (Get-FileHash $zip -Algorithm SHA256).Hash -ne $expected) {
            throw 'Electron archive checksum mismatch.'
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $runtime
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install executable resource editor
        run: npm install --no-save --package-lock=false resedit@1.7.2
      - name: Test episode controls in Electron
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'quiet-screen-electron/electron.exe'
          $test = (Resolve-Path scripts/check-episode-ui.mjs).Path
          $process = Start-Process -FilePath $runtime -ArgumentList ('"' + $test + '"') -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput ui-output.txt -RedirectStandardError ui-error.txt
          Get-Content ui-output.txt
          Get-Content ui-error.txt
          exit $process.ExitCode
      - name: Test franchise lookup controls in Electron
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'quiet-screen-electron/electron.exe'
          $test = (Resolve-Path scripts/check-franchise-ui.mjs).Path
          $process = Start-Process -FilePath $runtime -ArgumentList ('"' + $test + '"') -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput ui-output.txt -RedirectStandardError ui-error.txt
          Get-Content ui-output.txt
          Get-Content ui-error.txt
          exit $process.ExitCode
      - name: Test duplicate additions and type filters in Electron
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'quiet-screen-electron/electron.exe'
          $test = (Resolve-Path scripts/check-duplicates-ui.mjs).Path
          $process = Start-Process -FilePath $runtime -ArgumentList ('"' + $test + '"') -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput ui-output.txt -RedirectStandardError ui-error.txt
          Get-Content ui-output.txt
          Get-Content ui-error.txt
          exit $process.ExitCode
      - name: Test episode releases and Google reconnect in Electron
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'quiet-screen-electron/electron.exe'
          foreach ($name in @('releases','reconnect','library','progress')) {
            $test = (Resolve-Path "scripts/check-$name-ui.mjs").Path
            $process = Start-Process -FilePath $runtime -ArgumentList ('"' + $test + '"') -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput ui-output.txt -RedirectStandardError ui-error.txt
            Get-Content ui-output.txt
            Get-Content ui-error.txt
            if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          }
      - name: Test installer close consent
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'quiet-screen-electron/electron.exe'
          $compiler = @("${env:ProgramFiles(x86)}/NSIS/makensis.exe", "$env:ProgramFiles/NSIS/makensis.exe") |
            Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          ./scripts/check-installer-close.ps1 -Electron $runtime -Compiler $compiler
      - name: Build installer
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'quiet-screen-electron'
          $compiler = @("${env:ProgramFiles(x86)}/NSIS/makensis.exe", "$env:ProgramFiles/NSIS/makensis.exe") |
            Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (!$compiler) { throw 'NSIS compiler was not installed.' }
          node desktop/build.mjs $runtime $compiler
      - name: Build local browser package
        run: |
          node scripts/build-browser.mjs
          Copy-Item work/browser/quiet-screen-pc.zip work/windows/
      - uses: actions/upload-artifact@v4
        with:
          name: quiet-screen-windows-x64
          path: |
            work/windows/Quiet-Screen-Setup-*-x64.exe
            work/windows/SHA256SUMS.txt
            work/windows/quiet-screen-pc.zip
          if-no-files-found: error

  release:
    concurrency:
      group: quiet-screen-release-assets
      cancel-in-progress: false
    if: inputs.publish
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quiet-screen-windows-x64
          path: release
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish Windows and browser release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-platform.mjs windows release
